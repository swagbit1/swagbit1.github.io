  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Sketch elements */
  .box { border: 1.5px solid #555; border-radius: 2px; background: #1a1a1a; }
  .box.amber { border-color: #c8791a; }
  .box.gold { border-color: #f0b429; }
  .box.pink { border-color: #ff6b9d; }
  .box.teal { border-color: #4ecdc4; }

  .annotation.right::before { content: ''; }
  .annotation.right::after { content: ' →'; }

/* ─── Reusable sketch atoms ─── */
const Stars = ({ n = 30 }) => {
  const pts = React.useMemo(() => Array.from({length: n}, (_, i) => ({
    x: (i * 137.5 % 100),
    y: (i * 73.1 % 100),
    r: i % 3 === 0 ? 1.5 : 0.8,
    o: 0.2 + (i % 5) * 0.1,
  })), [n]);
  return (
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}>
      {pts.map((p,i) => <circle key={i} cx={`${p.x}%`} cy={`${p.y}%`} r={p.r} fill="white" opacity={p.o}/>)}
    </svg>
  );
};

const PetrovaArc = () => (
  <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',opacity:0.15}}>
    <path d="M -50 120 Q 200 20 450 80 Q 700 140 950 40" stroke="#ff6b9d" strokeWidth="40" fill="none" opacity="0.4"/>
  </svg>
);

      <div style={{fontSize:10, color:'#666', lineHeight:1.4}}>{tags.join(' · ')}</div>

);
